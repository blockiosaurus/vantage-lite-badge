name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Boots the way Railway runs it
        run: |
          PUBLIC_ORIGIN=https://ci.example PORT=8787 npm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/healthz && exit 0; sleep 1; done
          exit 1

  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Fixtures are what the server answers
        working-directory: server
        run: |
          npm ci
          EXPORT_FIXTURES=../tools/harness/fixtures.json npx vitest run test/export-fixtures.test.ts
          git diff --exit-code ../tools/harness/fixtures.json
      - name: Badge scenarios on the badge's Lua 5.5
        run: tools/harness/run.sh
